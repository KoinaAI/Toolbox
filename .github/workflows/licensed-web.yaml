name: Licensed Web Build
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: licensed-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require a licensed build credential
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
        run: |
          if [[ -z "$HEROUI_AUTH_TOKEN" ]]; then
            echo '::error::Configure the repository HEROUI_AUTH_TOKEN secret for HeroUI Pro first. No frontend build was performed.'
            exit 1
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-fund --no-audit
      - run: npm run setup:pro
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
      - run: npm run build
