<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f9fb" />
    <meta name="description" content="乱七八糟工具箱，把日常琐事整理得井井有条。开发、设计、文本与生活工具，一处找到。" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try { const theme = JSON.parse(localStorage.getItem('toolbox.theme')); const dark = theme === 'dark' || ((!theme || theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches); document.documentElement.classList.toggle('dark', dark); document.documentElement.style.colorScheme = dark ? 'dark' : 'light'; } catch (_) {}
    </script>
    <title>乱七八糟工具箱 · 让日常更顺手</title>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
